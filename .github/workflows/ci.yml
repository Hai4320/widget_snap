name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run against stable & beta: the package drives Flutter's internal
    # render-pipeline API, so catch upstream breakage before users do.
    - cron: '0 3 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
